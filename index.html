    /* Kartenanzeige ohne JavaScript */
    .map-display {
      display: none;
      width: 100%;
      min-height: 550px;
      background-image: var(--map-url, none);
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 0.95rem;
    }

    /* Hinweistext, solange keine passende Bildregel greift */
    .map-display::before {
      content: "Für diese Kombination liegt aktuell keine Karte vor.";
      display: var(--fallback-display, block);
    }

    /* Sobald mindestens ein Dropdown ausgewählt ist: Startmeldung ausblenden, Kartenfläche zeigen */
    .container:has(#select-service option:not([value="none"]):checked) #map-status,
    .container:has(#select-indicator option:not([value="none"]):checked) #map-status,
    .container:has(#select-level option:not([value="none"]):checked) #map-status {
      display: none;
    }

    .container:has(#select-service option:not([value="none"]):checked) .map-display,
    .container:has(#select-indicator option:not([value="none"]):checked) .map-display,
    .container:has(#select-level option:not([value="none"]):checked) .map-display {
      display: flex;
    }
