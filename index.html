<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoJSON im Browser anzeigen</title>
    
    <!-- Leaflet CSS (Design für die Karte) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- Hier wird die Karte platziert -->
    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // 1. Karte initialisieren und auf Mitte von Deutschland zentrieren
        const map = L.map('map').setView([51.1657, 10.4515], 6);

        // 2. OpenStreetMap-Hintergrundkarte laden
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 3. Deine GeoJSON-Datei laden 
        // (Ersetze 'daten.geojson' durch den exakten Dateinamen deiner Datei)
        fetch('maps/daten.geojson')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Datei konnte nicht geladen werden');
                }
                return response.json();
            })
            .then(data => {
                // 4. GeoJSON zur Karte hinzufügen und stylen
                const geojsonLayer = L.geoJson(data, {
                    style: {
                        color: "#ff7800",     // Rahmenfarbe
                        weight: 2,            // Linienstärke
                        fillColor: "#0078ff", // Füllfarbe
                        fillOpacity: 0.5      // Transparenz (0 = unsichtbar, 1 = voll)
                    },
                    onEachFeature: function(feature, layer) {
                        // Wenn die Daten Attribute (z.B. Namen) haben, öffnet sich beim Klick ein Popup
                        if (feature.properties) {
                            let popupContent = "<b>Eigenschaften:</b><br>";
                            for (let key in feature.properties) {
                                popupContent += `<b>${key}:</b> ${feature.properties[key]}<br>`;
                            }
                            layer.bindPopup(popupContent);
                        }
                    }
                }).addTo(map);

                // 5. Die Ansicht automatisch auf die geladenen Daten zoomen
                map.fitBounds(geojsonLayer.getBounds());
            })
            .catch(error => {
                console.error('Fehler:', error);
                alert('Fehler beim Laden der GeoJSON-Datei. Schaue in die Browser-Konsole (F12) für Details.');
            });
    </script>
</body>
</html>
